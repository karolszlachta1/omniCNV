[metadata]
name = omniCNV
version=0.9.5
description = Analysis of NGS data to find CNA
author = Karol Szlachta, Wojciech, Rosikiewicz, Gang Wu
license = MIT
license_files = LICENSE
long_description = file: README.md
long_description_content_type = text/markdown
platforms = unix, linux

[options]
python_requires = >=3.11
packages =
    omniCNV
    Fryzlewicz
    helperScripts
package_dir =
    omniCNV = ./omniCNV
    Fryzlewicz = ./Fryzlewicz
    helperScripts = ./helperScripts
install_requires =
    matplotlib>=3.10.1
    numpy>=2.3.4
    pandas>=2.3.3
    scipy>=1.15.2
    numba>=0.64.0
    polars>=1.39.0
    pyarrow>=23.0.1
    vcfpy>=0.13.8

[options.extras_require]
test =
    pytest>=8.0

[tool:pytest]
testpaths =
    tests

[options.package_data]
omniCNV =
    config.ini
    config_template.ini

[options.entry_points]
console_scripts =
    omniCNV = omniCNV.__main__:main
    replay_plot_clones = helperScripts.replay_plot_clones:main
    calc_ref_coverage = helperScripts.calc_ref_panel:main