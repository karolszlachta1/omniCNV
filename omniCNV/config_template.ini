# omniCNV configuration template
#
# Copy this file, replace the three FILES paths and input-column names, then pass
# it with: omniCNV -c config.ini ...
#
# Profile recommendations:
#
#   hg38_wgs:
#     PTMthr=0.01, cvthr=10
#     gc/ac p0=0.96, length=51, ms=1, absolute_counts_threshold=0.2
#     initial_scale=2
#
#   hg38_rna:
#     PTMthr=0.2, cvthr=10
#     gc p0=0.95, gc_ms=2, ac p0=0.95, ac_ms=1
#     absolute_counts_threshold=1, initial_scale=8
#
#   hg38_atac:
#     PTMthr=0.1, cvthr=10
#     gc/ac p0=0.95, length=51, ms=1, absolute_counts_threshold=1
#     initial_scale=5
#
#   hg38_wes:
#     PTMthr=0.2, cvthr=20
#     gc/ac p0=0.95, length=51, ms=1, absolute_counts_threshold=0.5
#     initial_scale=7, 
#


#Specify patrhs to reference files
[FILES]
markerslist = /path/to/reference/markers.tsv.gz
arms = /path/to/reference/chromarm.dat
cyto = /path/to/reference/cytoBand.dat

#Define columns' names in gene count file
[GENE_COUNT]
# Required for -t rna, -t wes, -t atac, and -t chip.
geneID = geneID
count = count
cpm_thr = 1

#Define columns' in VCF file
[VCF_FORMAT]
chrom_field = 0
position_field = 1
ref_field = 3
alt_field = 4
tag_name_field = 8
tag_field = 9

#Define columns' names in allelic count file
[ALLELIC_COUNT_FORMAT]
Chr = Chr
Pos = Pos
ref_cts = reference_tumor_count
alt_cts = alternative_tumor_count
# "Type" column is required and values other than "SNP" are filtered out 
Type = Type
ref = Chr_Allele
alt = Alternative_Allele

[ARMS]
excluded_arms = chr22p,chr15p,chr21p,chrYp

#Parameters to filter allelic counts
[AC_FILTER]
#Fraction of markers with vaf = 1 required to asign ai = 0.5 
PTMthr = 0.2
#Minimal counts require to consider a marker for ai estimation
cvthr = 10

[SEGMENTATION]
#Lower limit of markers required to perform segmentation. 
min_markers_for_seg = 200
#gc segmentation params, refere to Fryzlewicz transformation description for details
#New segment break point is searched for within <0.5, p0> of current segment
#p0 >= 0.5, p0 should be close to 1
gc_p0 = 0.95
#Stoping condition for breaking segment
gc_length = 51
#z-score threshold for rejecting segment as noise
gc_ms = 1

#ac segmentation params, refere to Fryzlewicz transformation description for details
#meaning is the same as for gc segmentation
ac_p0 = 0.95
ac_length = 51
ac_ms = 1
ac_thr = 1
gc_thr = 1
absolute_counts_threshold = 0.2

[KARYOTYPING]
#Threshold for AI to consider segment as imbalanced 
max_dip_ai = 0.02
#Initial scale to recalculate relative coverage into copy number
#cn = 2 + (m - m0)*scale
initial_scale = 2
#Threshold for outlier detection in balanced segment analysis, z-scored
DUP_MAD_thr = 2
#minimal segment size /in Mbp/ to include in karyotype optimisation
MIN_SIZE = 10

[chrY]
PAR = ((0, 2781479), (26600001, 57217415))
vaf_min = 0.98
